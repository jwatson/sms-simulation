[package]
name = "sms-simulation"
version = "0.1.0"
authors = ["John Watson <john@jwatson.dev>"]
edition = "2024"
rust-version = "1.98.1"
description = "A simulation of an SMS alert system."
repository = "https://github.com/jwatson/sms-simulation"
license = "MIT"

[dependencies]
async-channel = "2.5.0"
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
console-subscriber = { version = "0.5.0", optional = true }
rand = "0.10.3"
rand_distr = "0.6.0"
tokio = { version = "1.53.1", features = ["macros", "parking_lot", "rt-multi-thread", "sync", "time", "tracing"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "parking_lot"] }

[features]
default = []
console = ["dep:console-subscriber"]

[profile.dev.package.backtrace]
opt-level = 3

[profile.release]
codegen-units = 1
opt-level = 3
strip = "symbols"
lto = "fat"
